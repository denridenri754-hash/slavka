<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гонки на Славке</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #speedometer {
            font-size: 36px;
            font-weight: bold;
        }
        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ddd;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
    <!-- Three.js и зависимости -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <!-- Cannon.js для физики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="loading">Загрузка модели slavka.fbx...</div>
    
    <div id="ui">
        <div id="speedometer">0 км/ч</div>
    </div>

    <div id="controls-info">
        <b>Управление:</b><br>
        W / A / S / D или Стрелки — Газ / Руль / Тормоз<br>
        Пробел — Ручник<br>
        C — Сменить камеру<br>
        R — Восстановить позицию
    </div>

    <script>
        let scene, camera, renderer, world;
        let carModel, carBody, vehicle;
        let speedElement = document.getElementById('speedometer');
        let loadingElement = document.getElementById('loading');

        const keys = { forward: false, backward: false, left: false, right: false, brake: false };
        let cameraMode = 0; // 0: Сзади, 1: От первого лица, 2: Сверху

        function init() {
            // 1. Графика Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0a0e0);
            scene.fog = new THREE.Fog(0xa0a0e0, 50, 500);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 10;
            dirLight.shadow.camera.far = 400;
            const d = 100;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 2. Физика
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.defaultContactMaterial.friction = 0.1;

            // 3. Трасса
            createTrack();

            // 4. Инициализация физики авто
            initPhysicsCar();

            // 5. Загрузка FBX
            loadCarModel();

            // События
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', (e) => handleKeys(e, true));
            window.addEventListener('keyup', (e) => handleKeys(e, false));

            animate();
        }

        function createTrack() {
            // Земля
            const groundMat = new CANNON.Material('groundMaterial');
            const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            const groundMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1000, 1000),
                new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 })
            );
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // Трасса
            const trackPoints = [
                new THREE.Vector3(-100, 0, -100),
                new THREE.Vector3(100, 0, -100),
                new THREE.Vector3(150, 0, 0),
                new THREE.Vector3(100, 0, 100),
                new THREE.Vector3(-50, 0, 150),
                new THREE.Vector3(-150, 0, 50)
            ];

            const curve = new THREE.CatmullRomCurve3(trackPoints, true);
            const trackGeometry = new THREE.TubeGeometry(curve, 100, 12, 12, true);
            const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
            const trackMesh = new THREE.Mesh(trackGeometry, trackMaterial);
            trackMesh.scale.set(1, 0.05, 1);
            trackMesh.position.y = 0.1;
            trackMesh.receiveShadow = true;
            scene.add(trackMesh);
        }

        function initPhysicsCar() {
            const chassisShape = new CANNON.Box(new CANNON.Vec3(1.2, 0.6, 2.2));
            carBody = new CANNON.Body({ mass: 800 });
            carBody.addShape(chassisShape);
            carBody.position.set(0, 2, 0);
            world.addBody(carBody);

            vehicle = new CANNON.RaycastVehicle({
                chassisBody: carBody,
                indexRightAxis: 0,
                indexUpAxis: 1,
                indexForwardAxis: 2
            });

            const options = {
                radius: 0.4,
                directionLocal: new CANNON.Vec3(0, -1, 0),
                suspensionStiffness: 30,
                suspensionRestLength: 0.3,
                frictionSlip: 2.5,
                dampingRelaxation: 2.3,
                dampingCompression: 4.4,
                maxSuspensionForce: 100000,
                rollInfluence: 0.01,
                axleLocal: new CANNON.Vec3(-1, 0, 0),
                chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
                maxSuspensionTravel: 0.3,
                customSlidingRotationalSpeed: -30,
                useCustomSlidingRotationalSpeed: true
            };

            options.chassisConnectionPointLocal.set(1, -0.2, 1.2);
            vehicle.addWheel(options);
            options.chassisConnectionPointLocal.set(-1, -0.2, 1.2);
            vehicle.addWheel(options);
            options.chassisConnectionPointLocal.set(1, -0.2, -1.2);
            vehicle.addWheel(options);
            options.chassisConnectionPointLocal.set(-1, -0.2, -1.2);
            vehicle.addWheel(options);

            vehicle.addToWorld(world);
        }

        function createFallbackCar() {
            // Запасная 3D-модель машины на случай ошибки загрузки
            const group = new THREE.Group();
            const bodyMesh = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 1.2, 4.4),
                new THREE.MeshStandardMaterial({ color: 0xd0312d })
            );
            bodyMesh.castShadow = true;
            group.add(bodyMesh);

            const cabinMesh = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.8, 2),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            cabinMesh.position.set(0, 0.9, -0.2);
            cabinMesh.castShadow = true;
            group.add(cabinMesh);

            carModel = group;
            scene.add(carModel);
        }

        function loadCarModel() {
            const loader = new THREE.FBXLoader();
            // Загружаем slavka.fbx (без кириллицы)
            loader.load('slavka.fbx', (fbx) => {
                carModel = fbx;
                carModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                carModel.scale.set(0.015, 0.015, 0.015);
                scene.add(carModel);
                loadingElement.style.display = 'none';
            }, 
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100) || 0;
                loadingElement.innerText = `Загрузка slavka.fbx... ${percent}%`;
            },
            (error) => {
                console.warn('Не удалось загрузить FBX, создаем стандартное авто.', error);
                createFallbackCar();
                loadingElement.innerText = 'Загружена стандартная модель (slavka.fbx не найден)';
                setTimeout(() => { loadingElement.style.display = 'none'; }, 3000);
            });
        }

        function handleKeys(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.forward = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.backward = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.left = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.right = isDown; break;
                case 'Space': keys.brake = isDown; break;
                case 'KeyC': 
                    if (isDown) cameraMode = (cameraMode + 1) % 3; 
                    break;
                case 'KeyR':
                    if (isDown && carBody) {
                        carBody.position.set(0, 2, 0);
                        carBody.quaternion.set(0, 0, 0, 1);
                        carBody.velocity.set(0, 0, 0);
                        carBody.angularVelocity.set(0, 0, 0);
                    }
                    break;
            }
        }

        function updatePhysics() {
            if (!vehicle) return;

            const maxForce = 1200;
            const maxSteer = 0.5;
            const brakeForce = 45;

            const engineForce = (keys.forward ? -maxForce : 0) + (keys.backward ? maxForce : 0);
            vehicle.applyEngineForce(engineForce, 2);
            vehicle.applyEngineForce(engineForce, 3);

            const steer = (keys.left ? maxSteer : 0) + (keys.right ? -maxSteer : 0);
            vehicle.setSteeringValue(steer, 0);
            vehicle.setSteeringValue(steer, 1);

            const currentBrake = keys.brake ? brakeForce : 0;
            vehicle.setBrake(currentBrake, 0);
            vehicle.setBrake(currentBrake, 1);
            vehicle.setBrake(currentBrake, 2);
            vehicle.setBrake(currentBrake, 3);

            world.step(1 / 60);

            if (carModel) {
                carModel.position.copy(carBody.position);
                carModel.quaternion.copy(carBody.quaternion);
            }

            const speed = carBody.velocity.norm() * 3.6;
            speedElement.innerText = `${Math.round(speed)} км/ч`;
        }

        function updateCamera() {
            if (!carModel) return;

            const carPos = carModel.position;

            if (cameraMode === 0) {
                const offset = new THREE.Vector3(0, 3, -7).applyQuaternion(carModel.quaternion);
                camera.position.lerp(carPos.clone().add(offset), 0.1);
                camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 1, 0)));
            } else if (cameraMode === 1) {
                const offset = new THREE.Vector3(0, 1.1, 0.2).applyQuaternion(carModel.quaternion);
                camera.position.copy(carPos.clone().add(offset));
                const lookAtOffset = new THREE.Vector3(0, 1.1, 10).applyQuaternion(carModel.quaternion);
                camera.lookAt(carPos.clone().add(lookAtOffset));
            } else if (cameraMode === 2) {
                camera.position.set(carPos.x, carPos.y + 25, carPos.z);
                camera.lookAt(carPos);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            updateCamera();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
